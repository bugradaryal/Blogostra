<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14181f" />
    <meta data-static-seo name="description" content="MyBlog" />
    <meta data-static-seo property="og:type" content="website" />
    <meta data-static-seo property="og:site_name" content="MyBlog" />
    <meta data-static-seo property="og:title" content="MyBlog" />
    <meta data-static-seo name="twitter:card" content="summary" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>MyBlog</title>
    <script>
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
